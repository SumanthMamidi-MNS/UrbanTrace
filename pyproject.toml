[project]
name = "sutra"
version = "0.1.0"
description = "SUTRA — City-Wide AI Engine for Multi-Camera ANPR Trajectory Tracking (SIH26127)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "numpy",
    "scipy",
    "scikit-learn",
    "networkx",
    "rapidfuzz",
    "pyyaml",
    "typer",
    "rich",
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    # Needed only to run tests/test_synth_plate_safety.py (renders plate
    # images to verify the OCR renderer's character-containment guarantee)
    # under the main venv, per the reviewer's explicit requirement that
    # this test -- unlike the training/inference code -- run without torch.
    # Both are lightweight, CPU-only, non-CUDA packages, unlike torch, which
    # remains confined to the separate OCR venv.
    "pillow",
    "opencv-python-headless",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*", "sim*", "api*", "eval*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
